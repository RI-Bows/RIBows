name: Playwright

on:
  workflow_dispatch:
  push:
    branches: [main, master, Issue-132-2] # to test if I fixed it w/out PR
  pull_request:
    branches: [main, master]

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js app
        run: | 
          npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: "http://localhost:3000"
          STACK_SECRET_SERVER_KEY: ${{ secrets.STACK_SECRET_SERVER_KEY }}
      - name: Start server
        run: npx next start
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: "http://localhost:3000"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STACK_SECRET_SERVER_KEY: ${{ secrets.STACK_SECRET_SERVER_KEY }}
        shell: bash
      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run setup scripts
        run: |
          node scripts/save-admin-auth.js
          node scripts/save-club-auth.js
          node scripts/save-user-auth.js
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

